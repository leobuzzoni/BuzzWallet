spring.application.name=buzzwallet

# Banco de dados (credenciais vêm de variáveis de ambiente)
spring.datasource.url=jdbc:mysql://localhost:3306/buzzwallet
spring.datasource.username=${DB_USUARIO:buzzwallet_app}
spring.datasource.password=${DB_SENHA}

# JPA: o schema é gerenciado pelo Flyway, o Hibernate só valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC